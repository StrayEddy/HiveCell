\* HiveCell interlock -- SAFETY run.
\*
\* Fully adversarial environment: every sensor channel may read anything at
\* every tick, the safety edge may trip, the E-stop may be hit and released,
\* and power may drop and return. The safety claims must hold across ALL of it.

SPECIFICATION Spec

CONSTANTS
    Steps      = 4
    DwellTicks = 2
    HoldTicks  = 2
    EnvKind    = "ADVERSARIAL"

INVARIANTS
    TypeOK
    Inv_NoAdvanceWhileOccupied
    Inv_SweepNeedsAllChannelsClear
    Inv_FaultMeansNoSweep
    Inv_NoSweepWhileContact
    Inv_EStopHalts
    Inv_BlockedIsStill
    Inv_NoCrush
    Inv_NoTripHeldAtFlush

PROPERTIES
    P_NoAdvanceUnderLife
    P_NoAdvanceUnderContact
    P_NoAdvanceUnpowered
    P_NoTeleport
    P_NoAutoRestart

CHECK_DEADLOCK TRUE
