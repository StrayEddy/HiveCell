\* HiveCell interlock -- BLACKOUT run (SF4 / FMEA F3).
\*
\* Benign environment except that power may fail at ANY point in the cycle and
\* never returns. Proves the fail-open drive relieves: the piston never rests
\* pinned mid-stroke, it either backs out to deployed or sits latched at flush
\* (where geometry, FMEA F5, puts no occupant).

SPECIFICATION Spec

CONSTANTS
    Steps      = 4
    DwellTicks = 2
    HoldTicks  = 2
    EnvKind    = "BLACKOUT"

INVARIANTS
    TypeOK
    Inv_EStopHalts
    Inv_NoCrush

PROPERTIES
    P_NoAdvanceUnpowered
    P_PinRelieves

CHECK_DEADLOCK TRUE
