\* HiveCell interlock -- LIVENESS run.
\*
\* Benign environment (nothing ever wrong). Proves the machine actually WORKS:
\* the item left behind gets cleared and the pod returns to service. Without
\* this, a machine frozen solid would satisfy every safety property.

SPECIFICATION Spec

CONSTANTS
    Steps      = 4
    DwellTicks = 2
    HoldTicks  = 2
    EnvKind    = "BENIGN"

INVARIANTS
    TypeOK
    Inv_NoAdvanceWhileOccupied

PROPERTIES
    P_BagEventuallyCleared
    P_ReturnsToService

CHECK_DEADLOCK TRUE
